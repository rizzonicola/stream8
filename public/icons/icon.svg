<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Stream8">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B211F"/>
      <stop offset="100%" stop-color="#0A1211"/>
    </linearGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CE5DB"/>
      <stop offset="100%" stop-color="#0F8B8D"/>
    </linearGradient>
  </defs>

  <!-- Sfondo: rounded square in stile app-icon moderno -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>

  <!-- Anello sottile: richiama il concetto di streaming/loop continuo -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#4FD1C5" stroke-width="10" opacity="0.25"/>

  <!-- Triangolo "play", leggermente decentrato per bilanciamento ottico -->
  <path d="M 208 158 L 368 256 L 208 354 Z" fill="url(#play)"/>
</svg>
